<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" type="text/css" href="public/css/style1.css">
</head>
<body>

  <div class="calculator">
    <!-- Pantalla de la calculadora -->
    <div class="display">3+3</div>

    <!-- Teclado de botones -->
    <div class="buttons">
      <!-- Fila 1 -->
      <button class="btn btn-red">C</button>
      <button class="btn btn-red">CE</button>
      <button class="btn btn-orange">/</button>
      <button class="btn btn-orange">x</button>

      <!-- Fila 2 -->
      <button class="btn btn-gray">7</button>
      <button class="btn btn-gray">8</button>
      <button class="btn btn-gray">9</button>
      <button class="btn btn-orange">-</button>

      <!-- Fila 3 -->
      <button class="btn btn-gray">4</button>
      <button class="btn btn-gray">5</button>
      <button class="btn btn-gray">6</button>
      <button class="btn btn-orange">+</button>

      <!-- Fila 4 y 5 agrupadas con Grid -->
      <button class="btn btn-gray">1</button>
      <button class="btn btn-gray">2</button>
      <button class="btn btn-gray">3</button>
      <button class="btn btn-orange btn-equal">=</button>

      <button class="btn btn-gray btn-zero">0</button>
      <button class="btn btn-gray">.</button>
    </div>
  </div>

</body>
</html>
